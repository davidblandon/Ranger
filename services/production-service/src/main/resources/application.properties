spring.application.name=production-service
server.port=8080

# --- Datasource (PostgreSQL) ---
# Defaults target a local Postgres; override with env vars in Docker/CI.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:production}
spring.datasource.username=${DB_USER:production}
spring.datasource.password=${DB_PASSWORD:production}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
